version: "3.9"

services:
  db:
    image: postgres:16
    container_name: auth-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  auth-api:
    build:
      context: ../src/Auth.Api
      dockerfile: ../appliance/Dockerfile
    container_name: auth-api
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=authdb;Username=admin;Password=admin123"

  authz-api:
    build:
      context: ../src/AuthZ.Api
      dockerfile: ../appliance/Dockerfile.authz
    container_name: authz-api
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=authdb;Username=admin;Password=admin123"

volumes:
  postgres_data: